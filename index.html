<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sorteos solidarios para ayudar a quienes más lo necesitan. Comprá tu número y sumate a esta causa." />
  <meta name="theme-color" content="#0F0E17" />
  <meta property="og:title" content="Sorteos Solidarios 💙 Ayudemos Juntos" />
  <meta property="og:description" content="Participá de los sorteos solidarios y ayudá a quienes más lo necesitan. ¡Cada número cuenta!" />
  <meta property="og:type" content="website" />
  <title>Sorteos Solidarios 💙 Ayudemos Juntos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💙</text></svg>" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="app">
    <!-- Loading state -->
    <div id="initial-loader" style="
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:#0F0E17;
      color:#A7A9BE;
      font-family:'Inter',sans-serif;
      gap:16px;
    ">
      <div style="font-size:3rem;animation:spin 1s linear infinite;">💙</div>
      <p style="font-size:1rem;">Cargando sorteos...</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }
  </style>

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Tu configuración de Firebase -->
  <script src="firebase-config.js"></script>

  <!-- App -->
  <script src="app.js?v=3"></script>
</body>
</html>
