server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/javascript image/png image/webp;
    gzip_min_length 1000;

    # HTML nunca se cachea — así el browser siempre busca la versión nueva
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # JS/CSS sin cache — siempre fresco, no hay que bumpear ?v=
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Imágenes/iconos sí cachean (pesan más, cambian poco)
    location ~* \.(png|jpg|jpeg|webp|svg|ico|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Todas las rutas van al index (hash routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
