server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/javascript image/png image/webp;
    gzip_min_length 1000;

    # Cache de assets estáticos
    location ~* \.(css|js|png|jpg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Todas las rutas van al index (hash routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
